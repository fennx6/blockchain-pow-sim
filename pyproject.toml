[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chainsim"
version = "0.1.0"
description = "Simulasi blockchain terdistribusi dengan Proof-of-Work, gRPC, dan Docker"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "protobuf>=5.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
analysis = ["pandas>=2.2", "matplotlib>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chainsim = ["coordinator/dashboard/templates/*", "coordinator/dashboard/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "experiments", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["chainsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: butuh Docker berjalan (lewati dengan -m 'not integration')",
]

# Satu sumber angka konfigurasi (AGENTS.md Bagian 12: tidak ada angka ajaib).
# Setiap nilai dapat ditimpa variabel lingkungan; lihat pemetaannya di
# src/chainsim/config.py.

node:
  rest_port: 8081
  grpc_port: 50051
  peers: []              # diisi dari env PEERS di Docker network
  block_size: 50         # transaksi maksimum per blok
  confirmations: 3       # jumlah blok sebelum transaksi dianggap final

coordinator:
  host: "0.0.0.0"
  port: 8080
  nodes: []              # daftar "node_id=host:port" dari env NODES

blockchain:
  difficulty: 4          # jumlah nol heksadesimal di depan hash; dikalibrasi Fase 2
  mining_mode: "compete" # compete | pool
  nonce_space: 1000000000

network:
  heartbeat_interval_s: 2.0
  heartbeat_timeout_s: 1.0
  grpc_timeout_s: 2.0
  tx_forward_timeout_s: 2.0

logging:
  log_dir: "logs"
  level: "INFO"
